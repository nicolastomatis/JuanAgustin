<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Juan Agustín | Mi primer año</title>
    <meta name="description"
        content="Te invitamos a celebrar el primer año de Juan Agustín. ¡Una aventura entre estrellas!">

    <!-- OPEN GRAPH - WHATSAPP -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="¡Juan Agustín cumple su primer año!">
    <meta property="og:description" content="Una aventura entre estrellas. Te esperamos el 28 de noviembre de 2026.">
    <meta property="og:url" content="https://nicolastomatis.github.io/JuanAgustin/">
    <meta property="og:image" content="https://nicolastomatis.github.io/JuanAgustin/images/invitacion.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Invitación al primer cumpleaños de Juan Agustín">

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
</head>

<body>


    <section class="hero__inicio" id="inicio">

        <div class="estrellas"></div>

        <!-- Nubes -->
        <img class="nube1" src="./images/1.png" alt="">
        <img class="nube2" src="./images/2.png" alt="">
        <img class="nube3" src="./images/3.png" alt="">
        <img class="nube4" src="./images/4.png" alt="">
        <img class="nube5" src="./images/5.png" alt="">

        <!-- Presentación del viaje -->
        <div class="inicio__contenido">

            <h1>Una aventura está por comenzar...</h1>
            <p>Hay estrellas que esperan ser descubiertas.</p>

            <button class="btn__viaje" id="iniciarViaje">
                <span>Iniciar viaje</span>
                <span class="flecha">✦</span>
            </button>

        </div>

        <!-- Avioneta -->
        <div class="avioneta" id="avioneta">

            <svg viewBox="0 0 180 100" xmlns="http://www.w3.org/2000/svg">

                <!-- Ala trasera -->
                <path d="M55 49 L110 35 L120 41 L65 57 Z" fill="#C98B42" stroke="#704B2A" stroke-width="2" />

                <!-- Cola -->
                <path d="M35 49 L17 32 L25 29 L53 48 Z" fill="#E9B96E" stroke="#704B2A" stroke-width="2" />

                <!-- Cuerpo -->
                <path d="M20 54 Q65 38 120 48 Q148 53 165 49
                     Q155 65 119 65 L35 62 Z" fill="#EBC17E" stroke="#704B2A" stroke-width="2" />

                <!-- Cabina -->
                <path d="M83 46 Q91 27 108 36 L116 49 Z" fill="#9AC6D9" stroke="#704B2A" stroke-width="2" />

                <!-- Ala delantera -->
                <path d="M62 57 L120 48 L137 55 L76 68 Z" fill="#F2D49C" stroke="#704B2A" stroke-width="2" />

                <!-- Hélice -->
                <path d="M166 37 Q180 50 166 63" fill="none" stroke="#F4D37C" stroke-width="4" stroke-linecap="round" />

                <!-- Estrella decorativa -->
                <path d="M57 51 L60 55 L65 55 L61 59 L62 64
                     L57 61 L53 64 L54 59 L50 55 L55 55 Z" fill="#D69B39" />

            </svg>

        </div>

    </section>


    <script src="js/script.js"></script>
</body>

</html>
