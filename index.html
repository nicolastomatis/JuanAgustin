<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un viaje entre las nubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&family=Playpen+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main id="scene" class="state-day">
  <div class="sky sky-day"></div>
  <div class="sky sky-dusk"></div>
  <div class="sky sky-night"></div>
  <div class="sunlight"></div>

  <div id="camera">
    <div id="stars" class="layer"></div>
    <div id="clouds" class="layer"></div>
  </div>

  <div class="moon" aria-hidden="true"><img src="images/luna.png" alt="" draggable="false"></div>
  <div id="sparks" aria-hidden="true"></div>
  <div id="sit" aria-hidden="true"><img src="images/principito-luna.png" alt="" draggable="false"></div>
  <div id="prince" aria-hidden="true"><img src="images/principito.png" alt="" draggable="false"></div>

  <section id="intro" class="panel">
    <p>Un viaje entre las nubes</p>
    <h1>Una aventura está por comenzar...</h1>
    <button id="start" class="btn">✦ Comenzar el viaje ✦</button>
  </section>

  <section id="outro" class="panel" aria-live="polite">
    <h2>¡Juan Agustín cumple 1 año!</h2>
    <p>Te invitamos a celebrar su primer cumpleaños.</p>
    <div class="invite">
      <span class="when">Sábado 28 de noviembre</span>
      <span class="when">A partir de las 12:00 hs.</span>
      <span class="where">En la quinta de J.J. Almeyra</span>
    </div>
  </section>

  <button id="restart" class="btn-ghost">↻ Volver al comienzo</button>
</main>
<script src="js/script.js"></script>
</body>
</html>
